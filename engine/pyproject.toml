[project]
name = "reversi-engine"
version = "0.1.0"
description = "複数のLLMにリバーシを対戦させる対戦エンジン"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.60",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "choix>=0.3.5",
]

[project.scripts]
reversi-engine = "reversi_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reversi_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
