<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLMリバーシ対戦記録</title>
    <meta
      name="description"
      content="複数のLLMを同一条件でリバーシ対戦させた記録。ランキング・対戦表・棋譜リプレイ。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314503c'/%3E%3Cpath d='M16 5a11 11 0 0 0 0 22z' fill='%23171a16'/%3E%3Cpath d='M16 5a11 11 0 0 1 0 22z' fill='%23f6f5ee'/%3E%3C/svg%3E"
    />
    <script>
      // ライト/ダークモードの明示的な切り替え(ThemeToggle.tsx)を、Reactの初回描画前に
      // 反映しておく。ここで先に`data-theme`を立てないと、切り替え後にページを開いたとき
      // 一瞬だけ端末設定側の配色が見えてしまう(FOUC)。
      (function () {
        var stored = localStorage.getItem("llm-reversi-theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
